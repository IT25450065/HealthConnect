<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-wrap">
    <div class="auth-brand">
        <div class="logo">Health<span>Connect</span></div>
        <div class="tag">Reset your password</div>
    </div>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="card">
        <p class="muted small">
            Sending a reset link by email or SMS is outside the scope of this project,
            so your identity is confirmed with the email address and the phone number
            registered on your account.
        </p>
        <form th:action="@{/forgot-password}" th:object="${passwordResetForm}" method="post">
            <div class="form-row">
                <label for="email">Email address</label>
                <input type="email" id="email" th:field="*{email}">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="form-row">
                <label for="phone">Registered phone number</label>
                <input type="text" id="phone" th:field="*{phone}">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="form-row">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" th:field="*{newPassword}">
                <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>
            <div class="form-row">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <div class="form-actions">
                <button class="btn" type="submit">Change password</button>
                <a class="btn secondary" th:href="@{/login}">Back to login</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
