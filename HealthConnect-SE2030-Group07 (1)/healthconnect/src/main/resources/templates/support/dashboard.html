<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Support dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <h1>Patient relations dashboard</h1>
        <a class="btn" th:href="@{/support/feedback}">All feedback</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="stat-row">
        <div class="stat amber">
            <div class="value" th:text="${unanswered.size()}">0</div>
            <div class="label">Awaiting a response</div>
        </div>
        <div class="stat">
            <div class="value" th:text="${totalCount}">0</div>
            <div class="label">Total feedback received</div>
        </div>
    </div>

    <div class="card">
        <h2>Feedback waiting for a response</h2>
        <div th:if="${unanswered.isEmpty()}" class="empty">Every piece of feedback has been answered.</div>

        <div th:each="f : ${unanswered}" style="border-bottom:1px solid #d7dee5;padding:12px 0">
            <div class="page-head" style="margin-bottom:4px">
                <h3 style="font-size:16px" th:text="${f.patient.fullName}">patient</h3>
                <span class="stars" th:text="${f.stars}">*****</span>
                <span class="badge" th:text="${f.rating} + ' / 5'">5 / 5</span>
            </div>
            <p class="small muted" style="margin:0 0 6px">
                About <strong th:text="${f.doctor.fullName}">doctor</strong> &middot;
                visit on <span th:text="${f.appointment.dateTimeLabel}">date</span> &middot;
                submitted <span th:text="${f.submittedLabel}">date</span>
            </p>
            <p th:text="${f.comments}">comment</p>

            <form method="post" th:action="@{'/support/feedback/' + ${f.id} + '/respond'}">
                <div class="form-row">
                    <label>Response to the patient</label>
                    <textarea name="response" required></textarea>
                </div>
                <button class="btn small" type="submit">Send response</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
