<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Patient feedback')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <h1>Patient feedback</h1>
        <a class="btn secondary" th:href="@{/support/feedback(filter='all')}">All</a>
        <a class="btn secondary" th:href="@{/support/feedback(filter='unanswered')}">Unanswered only</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div th:if="${feedbackList.isEmpty()}" class="empty">No feedback to show.</div>

    <div class="card" th:each="f : ${feedbackList}">
        <div class="page-head">
            <h3 th:text="${f.patient.fullName}">patient</h3>
            <span class="stars" th:text="${f.stars}">*****</span>
            <span class="badge" th:text="${f.rating} + ' / 5'">5 / 5</span>
            <span class="badge ok" th:if="${f.answered}">Answered</span>
            <span class="badge low" th:unless="${f.answered}">Awaiting response</span>
        </div>
        <p class="small muted" style="margin-top:-8px">
            About <strong th:text="${f.doctor.fullName}">doctor</strong>
            (<span th:text="${f.doctor.specialization}">spec</span>) &middot;
            visit on <span th:text="${f.appointment.dateTimeLabel}">date</span> &middot;
            submitted <span th:text="${f.submittedLabel}">date</span>
        </p>
        <p th:text="${f.comments}">comment</p>

        <div class="alert success" th:if="${f.answered}">
            <strong>Our response:</strong> <span th:text="${f.officerResponse}">response</span>
            <span class="small muted" th:text="'(' + ${f.respondedLabel} + ')'"></span>
        </div>

        <form th:unless="${f.answered}" method="post"
              th:action="@{'/support/feedback/' + ${f.id} + '/respond'}">
            <div class="form-row">
                <label>Response to the patient</label>
                <textarea name="response" required></textarea>
            </div>
            <button class="btn small" type="submit">Send response</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
