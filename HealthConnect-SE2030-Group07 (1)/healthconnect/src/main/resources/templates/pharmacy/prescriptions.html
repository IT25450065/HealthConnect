<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Prescriptions')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <h1>Prescriptions</h1>
        <a class="btn secondary" th:href="@{/pharmacy/prescriptions(filter='pending')}"
           th:classappend="${filter == 'pending'} ? '' : ''">Pending only</a>
        <a class="btn secondary" th:href="@{/pharmacy/prescriptions(filter='all')}">All</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div th:if="${prescriptions.isEmpty()}" class="empty">No prescriptions to show.</div>

    <div class="table-wrap" th:unless="${prescriptions.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Issued</th>
                <th>Patient</th>
                <th>Prescribed by</th>
                <th>Medicines</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prescriptions}">
                <td th:text="${p.issuedLabel}">date</td>
                <td th:text="${p.patient.fullName}">patient</td>
                <td th:text="${p.doctor.fullName}">doctor</td>
                <td class="small">
                    <span th:each="i, s : ${p.items}">
                        <span th:text="${i.medicine.label}">m</span>
                        &times;<span th:text="${i.quantity}">0</span><span th:unless="${s.last}">, </span>
                    </span>
                </td>
                <td><span class="badge" th:classappend="${p.status.name()}" th:text="${p.status.displayName}">status</span></td>
                <td><a class="btn small" th:href="@{'/pharmacy/prescriptions/' + ${p.id}}">Open</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
