<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My ratings')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head"><h1>Feedback and ratings I have received</h1></div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="stat-row">
        <div class="stat amber">
            <div class="value"
                 th:text="${averageRating != null} ? ${#numbers.formatDecimal(averageRating, 1, 2)} : '-'">-</div>
            <div class="label">Average rating</div>
        </div>
        <div class="stat">
            <div class="value" th:text="${feedbackCount}">0</div>
            <div class="label">Reviews received</div>
        </div>
    </div>

    <div th:if="${feedbackList.isEmpty()}" class="empty">
        No patient has left feedback for you yet.
    </div>

    <div class="card" th:each="f : ${feedbackList}">
        <div class="page-head">
            <h3 th:text="${f.patient.fullName}">patient</h3>
            <span class="stars" th:text="${f.stars}">*****</span>
            <span class="badge" th:text="${f.rating} + ' / 5'">5 / 5</span>
        </div>
        <p class="small muted" style="margin-top:-8px">
            Visit on <span th:text="${f.appointment.dateTimeLabel}">date</span> &middot;
            submitted <span th:text="${f.submittedLabel}">date</span>
        </p>
        <p th:text="${f.comments}">comment</p>
        <div class="alert info" th:if="${f.answered}" style="margin-bottom:0">
            <strong>Patient relations responded:</strong>
            <span th:text="${f.officerResponse}">response</span>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
