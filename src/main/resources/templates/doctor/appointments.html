<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My appointments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head"><h1>All my appointments</h1></div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div th:if="${appointments.isEmpty()}" class="empty">No appointments have been booked with you yet.</div>

    <div class="table-wrap" th:unless="${appointments.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Date and time</th>
                <th>Patient</th>
                <th>Type</th>
                <th>Reason</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${a.dateTimeLabel}">date</td>
                <td th:text="${a.patient.fullName}">patient</td>
                <td><span class="badge" th:classappend="${a.type.name()}" th:text="${a.type.displayName}">type</span></td>
                <td th:text="${a.reason}">reason</td>
                <td><span class="badge" th:classappend="${a.status.name()}" th:text="${a.status.displayName}">status</span></td>
                <td>
                    <a class="btn small secondary"
                       th:href="@{'/doctor/patients/' + ${a.patient.id} + '/history'}">History</a>
                    <a th:if="${a.consultation == null and a.status.name() != 'CANCELLED'}"
                       class="btn small" th:href="@{/doctor/consultation/new(appointmentId=${a.id})}">Record</a>
                    <a th:if="${a.consultation != null}" class="btn small secondary"
                       th:href="@{'/doctor/consultations/' + ${a.consultation.id}}">View notes</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
