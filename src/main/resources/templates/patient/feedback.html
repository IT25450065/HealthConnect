<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My feedback')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <h1>My feedback</h1>
        <a class="btn" th:href="@{/patient/feedback/new}"
           th:unless="${rateable.isEmpty()}">Leave feedback</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="alert info" th:unless="${rateable.isEmpty()}">
        You have <strong th:text="${rateable.size()}">0</strong> completed visit(s) you have not rated yet.
    </div>
    <div class="alert info" th:if="${rateable.isEmpty()}">
        Feedback can be left once a consultation has been completed.
    </div>

    <div th:if="${feedbackList.isEmpty()}" class="empty">You have not left any feedback yet.</div>

    <div class="card" th:each="f : ${feedbackList}">
        <div class="page-head">
            <h3 th:text="${f.doctor.fullName}">doctor</h3>
            <span class="stars" th:text="${f.stars}">*****</span>
            <span class="badge" th:text="${f.rating} + ' / 5'">5 / 5</span>
        </div>
        <p class="small muted" style="margin-top:-8px">
            Visit on <span th:text="${f.appointment.dateTimeLabel}">date</span> &middot;
            submitted <span th:text="${f.submittedLabel}">date</span>
        </p>
        <p th:text="${f.comments}">comment</p>

        <div class="alert success" th:if="${f.answered}" style="margin-bottom:0">
            <strong>Response from patient relations:</strong>
            <span th:text="${f.officerResponse}">response</span>
            <span class="small muted" th:text="'(' + ${f.respondedLabel} + ')'"></span>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
