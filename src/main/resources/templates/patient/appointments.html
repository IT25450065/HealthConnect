<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My appointments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <h1>My appointments</h1>
        <a class="btn" th:href="@{/patient/appointments/book}">Book another</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div th:if="${appointments.isEmpty()}" class="empty">You have not booked any appointments yet.</div>

    <div class="table-wrap" th:unless="${appointments.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Date and time</th>
                <th>Doctor</th>
                <th>Specialization</th>
                <th>Type</th>
                <th>Reason</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${a.dateTimeLabel}">date</td>
                <td th:text="${a.doctor.fullName}">doctor</td>
                <td th:text="${a.doctor.specialization}">spec</td>
                <td><span class="badge" th:classappend="${a.type.name()}" th:text="${a.type.displayName}">type</span></td>
                <td th:text="${a.reason}">reason</td>
                <td><span class="badge" th:classappend="${a.status.name()}" th:text="${a.status.displayName}">status</span></td>
                <td>
                    <form th:if="${a.cancellable}" class="inline-form" method="post"
                          th:action="@{'/patient/appointments/' + ${a.id} + '/cancel'}">
                        <button class="btn small danger" type="submit">Cancel</button>
                    </form>
                    <a th:if="${a.status.name() == 'COMPLETED'}" class="btn small secondary"
                       th:href="@{/patient/feedback/new(appointmentId=${a.id})}">Leave feedback</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
