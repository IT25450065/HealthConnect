<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'HealthConnect - ' + ${pageTitle}">HealthConnect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Floating Notch Navbar -->
<div th:fragment="navbar" class="navbar-wrapper">
    <div class="notch-navbar">
        <a class="notch-brand" th:href="@{/}">
            <span class="notch-brand-icon">✚</span>
            <span>HealthConnect</span>
        </a>

        <div class="notch-links" th:if="${currentUser != null}">
            <!-- Pharmacist Module Links (UC-03) -->
            <th:block th:if="${currentUser.role.name() == 'PHARMACIST'}">
                <a th:href="@{/pharmacy/dashboard}" 
                   class="notch-link" 
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.endsWith('/dashboard') ? 'active' : ''}">
                    Dashboard
                </a>
                <a th:href="@{/pharmacy/medicines}" 
                   class="notch-link" 
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.endsWith('/medicines') and (#httpServletRequest.getParameter('lowStockOnly') == null) ? 'active' : ''}">
                    Stock Management
                </a>
                <a th:href="@{/pharmacy/medicines?lowStockOnly=true}" 
                   class="notch-link" 
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.getParameter('lowStockOnly') != null ? 'active' : ''}">
                    Low Stock List
                </a>
                <a th:href="@{/pharmacy/prescriptions}" 
                   class="notch-link" 
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.contains('/prescriptions') ? 'active' : ''}">
                    Dispensing Queue
                </a>
            </th:block>

            <!-- Other Role Fallbacks -->
            <th:block th:if="${currentUser.role.name() != 'PHARMACIST'}">
                <a th:href="@{/}" class="notch-link active">Main Portal</a>
            </th:block>
        </div>

        <div class="notch-spacer"></div>

        <div class="notch-actions" th:if="${currentUser != null}">
            <button type="button" class="notch-btn-secondary" onclick="document.body.classList.toggle('dark-mode')">Dark</button>
            <div class="notch-user-badge" th:text="${#strings.substring(currentUser.fullName, 0, 2).toUpperCase()}">Ph</div>
            <a th:href="@{/logout}" class="notch-btn-secondary">Logout</a>
        </div>
        
        <div class="notch-actions" th:if="${currentUser == null}">
            <a th:href="@{/login}" class="btn btn-small">Login</a>
            <a th:href="@{/register}" class="notch-btn-secondary">Register</a>
        </div>
    </div>
</div>

<!-- Flash / Alert Messages -->
<div th:fragment="messages" class="container">
    <div class="alert-banner alert-success" th:if="${success}">
        <span>✓</span>
        <span th:text="${success}">Success message</span>
    </div>
    <div class="alert-banner alert-error" th:if="${error}">
        <span>⚠</span>
        <span th:text="${error}">Error message</span>
    </div>
</div>

<div th:fragment="footer" class="footer">
    HealthConnect &middot; Web-Based Medical Portal &middot;
    SE2030 Software Engineering Group Project &middot; Group 2026-Y2-S1-MLB-WEB3G1-07
</div>

</body>
</html>
