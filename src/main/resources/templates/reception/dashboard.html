<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reception dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <h1>Reception dashboard</h1>
        <a class="btn" th:href="@{/reception/appointments}">Manage all appointments</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="stat-row">
        <div class="stat amber">
            <div class="value" th:text="${pendingCount}">0</div>
            <div class="label">Awaiting confirmation</div>
        </div>
        <div class="stat">
            <div class="value" th:text="${confirmedCount}">0</div>
            <div class="label">Confirmed</div>
        </div>
        <div class="stat">
            <div class="value" th:text="${today.size()}">0</div>
            <div class="label">Scheduled today</div>
        </div>
    </div>

    <div class="card">
        <h2>Today's schedule</h2>
        <div th:if="${today.isEmpty()}" class="empty">No appointments are scheduled for today.</div>

        <div class="table-wrap" th:unless="${today.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Type</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${today}">
                    <td th:text="${a.timeLabel}">time</td>
                    <td th:text="${a.patient.fullName}">patient</td>
                    <td th:text="${a.doctor.fullName}">doctor</td>
                    <td><span class="badge" th:classappend="${a.type.name()}" th:text="${a.type.displayName}">type</span></td>
                    <td><span class="badge" th:classappend="${a.status.name()}" th:text="${a.status.displayName}">status</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
