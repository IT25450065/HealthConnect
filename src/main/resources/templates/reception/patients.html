<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registered patients')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head"><h1>Registered patients</h1></div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div th:if="${patients.isEmpty()}" class="empty">No patients have registered yet.</div>

    <div class="table-wrap" th:unless="${patients.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Date of birth</th>
                <th class="num">Age</th>
                <th>Gender</th>
                <th>Blood group</th>
                <th>Address</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${patients}">
                <td th:text="${p.fullName}">name</td>
                <td th:text="${p.email}">email</td>
                <td th:text="${p.user.phone}">phone</td>
                <td th:text="${p.dateOfBirthLabel}">dob</td>
                <td class="num" th:text="${p.age} ?: '-'">-</td>
                <td th:text="${p.gender}">gender</td>
                <td th:text="${p.bloodGroup}">blood</td>
                <td class="small" th:text="${p.address}">address</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
