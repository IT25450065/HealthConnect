<html xmlns:th="http://www.thymeleaf.org">

<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

        <h1>That action could not be completed</h1>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
