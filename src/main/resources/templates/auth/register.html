<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-wrap wide">
    <div class="auth-brand">
        <div class="logo">Health<span>Connect</span></div>
        <div class="tag">Create a patient account</div>
    </div>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="card">
        <h2>Patient registration</h2>
        <p class="muted small">
            Registration creates your login account and your patient profile at the same time.
            Staff accounts are created by the hospital administrator.
        </p>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post">
            <div class="grid-2">
                <div class="form-row">
                    <label for="fullName">Full name *</label>
                    <input type="text" id="fullName" th:field="*{fullName}">
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="form-row">
                    <label for="email">Email address *</label>
                    <input type="email" id="email" th:field="*{email}">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-row">
                    <label for="password">Password *</label>
                    <input type="password" id="password" th:field="*{password}">
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="form-row">
                    <label for="confirmPassword">Confirm password *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
                    <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
                <div class="form-row">
                    <label for="phone">Phone number</label>
                    <input type="text" id="phone" th:field="*{phone}" placeholder="0771234567">
                    <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="form-row">
                    <label for="dateOfBirth">Date of birth</label>
                    <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}">
                    <div class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                </div>
                <div class="form-row">
                    <label for="gender">Gender</label>
                    <select id="gender" th:field="*{gender}">
                        <option value="">-- select --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="bloodGroup">Blood group</label>
                    <select id="bloodGroup" th:field="*{bloodGroup}">
                        <option value="">-- select --</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}">
                <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>
            <div class="form-actions">
                <button class="btn" type="submit">Create account</button>
                <a class="btn secondary" th:href="@{/login}">Back to login</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
