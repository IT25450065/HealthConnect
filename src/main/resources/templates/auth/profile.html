<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head"><h1>My profile</h1></div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="card">
        <p class="muted small">
            Signed in as <strong th:text="${currentUser.email}">email</strong>
            (<span th:text="${currentUser.roleLabel}">role</span>).
            Your email address and role cannot be changed here.
        </p>

        <form th:action="@{/profile}" th:object="${profileForm}" method="post">
            <div class="grid-2">
                <div class="form-row">
                    <label for="fullName">Full name *</label>
                    <input type="text" id="fullName" th:field="*{fullName}">
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="form-row">
                    <label for="phone">Phone number</label>
                    <input type="text" id="phone" th:field="*{phone}">
                    <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
            </div>

            <!-- Patient-only fields -->
            <th:block th:if="${currentUser.role.name() == 'PATIENT'}">
                <div class="grid-3">
                    <div class="form-row">
                        <label for="dateOfBirth">Date of birth</label>
                        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}">
                    </div>
                    <div class="form-row">
                        <label for="gender">Gender</label>
                        <select id="gender" th:field="*{gender}">
                            <option value="">-- select --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="bloodGroup">Blood group</label>
                        <select id="bloodGroup" th:field="*{bloodGroup}">
                            <option value="">-- select --</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}">
                </div>
            </th:block>

            <div class="form-actions">
                <button class="btn" type="submit">Save changes</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
