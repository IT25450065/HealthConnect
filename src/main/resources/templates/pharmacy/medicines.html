<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Medicine inventory')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <div>
            <h1>Medicine Inventory</h1>
            <p class="muted">Manage pharmaceutical stock levels, units, and reorder thresholds</p>
        </div>
        <a class="btn" th:href="@{/pharmacy/medicines/new}">+ Add Medicine</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="alert error" th:if="${lowStockCount > 0}">
        <strong th:text="${lowStockCount}">0</strong> medicine(s) are at or below their reorder threshold.
    </div>

    <div class="card">
        <form method="get" th:action="@{/pharmacy/medicines}">
            <div class="grid-2" style="align-items: flex-end;">
                <div class="form-row" style="margin-bottom: 0;">
                    <label for="q">Search by name</label>
                    <input type="text" id="q" name="q" th:value="${q}" placeholder="Search paracetamol, amoxicillin...">
                </div>
                <div class="form-row" style="margin-bottom: 0; display: flex; gap: 8px;">
                    <button class="btn" type="submit">Search</button>
                    <a class="btn secondary" th:href="@{/pharmacy/medicines}">Clear</a>
                </div>
            </div>
        </form>
    </div>

    <div th:if="${medicines.isEmpty()}" class="empty">No medicines match your query.</div>

    <div class="card" th:unless="${medicines.isEmpty()}" style="padding: 12px;">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Medicine</th>
                    <th>Unit</th>
                    <th class="num">In Stock</th>
                    <th class="num">Reorder At</th>
                    <th>Status</th>
                    <th>Quick Adjust</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${medicines}">
                    <td style="font-weight: 600;" th:text="${m.label}">name</td>
                    <td th:text="${m.unit}">unit</td>
                    <td class="num" style="font-weight: 600;" th:text="${m.stockQuantity}">0</td>
                    <td class="num" th:text="${m.reorderThreshold}">0</td>
                    <td>
                        <span class="badge low" th:if="${m.lowStock}">Low stock</span>
                        <span class="badge ok" th:unless="${m.lowStock}">OK</span>
                    </td>
                    <td>
                        <form class="inline-form" method="post" th:action="@{'/pharmacy/medicines/' + ${m.id} + '/adjust'}">
                            <input type="hidden" name="delta" value="50">
                            <button class="btn small" type="submit">+50</button>
                        </form>
                        <form class="inline-form" method="post" th:action="@{'/pharmacy/medicines/' + ${m.id} + '/adjust'}">
                            <input type="hidden" name="delta" value="-10">
                            <button class="btn small secondary" type="submit">-10</button>
                        </form>
                    </td>
                    <td style="text-align: right;"><a class="btn small secondary" th:href="@{'/pharmacy/medicines/' + ${m.id} + '/edit'}">Edit</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
