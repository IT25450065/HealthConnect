<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${medicineForm.id == null} ? 'Add Medicine' : 'Edit Medicine')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 720px;">
    <!-- Page Header -->
    <div class="page-head">
        <div class="page-head-content">
            <h1 th:text="${medicineForm.id == null} ? 'Add New Medicine' : 'Update Medicine Details'">Add Medicine</h1>
            <p>Enter medicine details, strength, current stock, and reorder threshold.</p>
        </div>
        <div>
            <a class="btn btn-secondary" th:href="@{/pharmacy/medicines}">← Back to Inventory</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="card">
        <form th:action="@{/pharmacy/medicines/save}" th:object="${medicineForm}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label class="form-label" for="name">Medicine Name *</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Paracetamol, Amoxicillin">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="strength">Strength / Concentration</label>
                    <input type="text" class="form-control" id="strength" th:field="*{strength}" placeholder="e.g. 500mg, 250mg">
                    <div class="field-error" th:if="${#fields.hasErrors('strength')}" th:errors="*{strength}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="unit">Unit Type</label>
                    <input type="text" class="form-control" id="unit" th:field="*{unit}" placeholder="e.g. Tablets, Capsules, Syrup">
                    <div class="field-error" th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}"></div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label class="form-label" for="stockQuantity">Current Stock Quantity *</label>
                    <input type="number" min="0" class="form-control" id="stockQuantity" th:field="*{stockQuantity}">
                    <div class="field-error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reorderThreshold">Minimum Reorder Threshold *</label>
                    <input type="number" min="0" class="form-control" id="reorderThreshold" th:field="*{reorderThreshold}">
                    <div class="field-error" th:if="${#fields.hasErrors('reorderThreshold')}" th:errors="*{reorderThreshold}"></div>
                </div>
            </div>

            <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 24px;">
                💡 A medicine is automatically flagged as <strong>Low Stock</strong> on the Pharmacist Dashboard when available stock falls at or below the reorder threshold.
            </p>

            <div style="display: flex; gap: 12px;">
                <button type="submit" class="btn" style="flex: 1;">Save Medicine Record</button>
                <a th:href="@{/pharmacy/medicines}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
