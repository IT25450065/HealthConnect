# =====================================================================
#  HealthConnect - Web-Based Medical Portal
#  SE2030 Group Project, Group 2026-Y2-S1-MLB-WEB3G1-07
# =====================================================================
spring.application.name=HealthConnect
server.port=8080

# ---------------------------------------------------------------------
#  MICROSOFT SQL SERVER CONNECTION  (PLACEHOLDER VALUES - EDIT THESE)
#
#  Every value below is a placeholder. Follow DBMS-Setup-Guide.md to
#  create the database and the login, then replace them.
#
#  Named instance instead of a port?  Use this form instead:
#    jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=HealthConnect;encrypt=true;trustServerCertificate=true
#
#  Windows Authentication instead of a SQL login? Delete the username and
#  password lines and add integratedSecurity=true to the URL - the guide
#  explains the extra DLL that setup needs.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HealthConnect;encrypt=true;trustServerCertificate=true
spring.datasource.username=REPLACE_WITH_YOUR_SQL_LOGIN
spring.datasource.password=REPLACE_WITH_YOUR_SQL_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------------------------------------------------------------------
#  JPA / HIBERNATE
#
#  ddl-auto=update  lets Hibernate create the tables from the @Entity
#                   classes the first time you run the app. Easiest start.
#  ddl-auto=validate  is what you should switch to AFTER creating the
#                   tables with the script in DBMS-Setup-Guide.md: it
#                   checks the tables match the entities and never
#                   changes your schema. See section 6 of that guide.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Store text as NVARCHAR rather than VARCHAR. This matters twice: patient
# names may contain non-Latin characters, and it makes Hibernate agree with
# the NVARCHAR columns in the CREATE TABLE script in DBMS-Setup-Guide.md,
# so ddl-auto=validate works against that script.
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.format_sql=true

# Keeps the JPA session open while the Thymeleaf page renders, so lazy
# collections (for example consultation.prescriptions) can be read in the
# template. Standard for a server-rendered Spring MVC application.
spring.jpa.open-in-view=true

# ---------------------------------------------------------------------
#  THYMELEAF - cache off so template edits show up without a restart
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false

# Show our own error pages rather than the default white label page
server.error.whitelabel.enabled=false
