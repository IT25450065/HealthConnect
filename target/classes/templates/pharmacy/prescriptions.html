<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Prescriptions')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="page-head">
        <div>
            <h1>Prescriptions Queue</h1>
            <p class="muted">Review and dispense medical prescriptions</p>
        </div>
        <div style="display: flex; gap: 8px;">
            <a class="btn" th:classappend="${filter == 'pending' or filter == null} ? '' : 'secondary'"
               th:href="@{/pharmacy/prescriptions(filter='pending')}">Pending Queue</a>
            <a class="btn" th:classappend="${filter == 'all'} ? '' : 'secondary'"
               th:href="@{/pharmacy/prescriptions(filter='all')}">All Prescriptions</a>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div th:if="${prescriptions.isEmpty()}" class="empty">No prescriptions found.</div>

    <div class="card" th:unless="${prescriptions.isEmpty()}" style="padding: 12px;">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Issued Date</th>
                    <th>Patient</th>
                    <th>Prescribed By</th>
                    <th>Prescribed Items</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${prescriptions}">
                    <td th:text="${p.issuedLabel}">date</td>
                    <td style="font-weight: 600;" th:text="${p.patient.fullName}">patient</td>
                    <td th:text="${p.doctor.fullName}">doctor</td>
                    <td class="small">
                        <span th:each="i, s : ${p.items}">
                            <span th:text="${i.medicine.label}">m</span>
                            &times;<span th:text="${i.quantity}">0</span><span th:unless="${s.last}">, </span>
                        </span>
                    </td>
                    <td><span class="badge" th:classappend="${p.status.name()}" th:text="${p.status.displayName}">status</span></td>
                    <td style="text-align: right;"><a class="btn small" th:href="@{'/pharmacy/prescriptions/' + ${p.id}}">Open</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
