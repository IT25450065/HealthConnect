<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="card">
        <h1>Access denied</h1>
        <p>
            You are signed in as
            <strong th:text="${currentUser != null} ? ${currentUser.roleLabel} : 'a guest'">role</strong>,
            and that page belongs to a different role.
        </p>
        <p class="muted small">
            This check is done by <code>AuthInterceptor</code> before the controller runs,
            so changing the URL by hand cannot get past it.
        </p>
        <p><a class="btn" th:href="@{/}">Back to my dashboard</a></p>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
